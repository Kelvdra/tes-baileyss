<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1720"/>
      <stop offset="100%" stop-color="#16222A"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2BC77E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2BC77E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- node/socket motif: devices linked to one hub, echoing multi-device websocket connections -->
  <g stroke="#2BC77E" stroke-width="1.6" opacity="0.55">
    <line x1="905" y1="150" x2="1000" y2="70"/>
    <line x1="905" y1="150" x2="1030" y2="150"/>
    <line x1="905" y1="150" x2="1000" y2="230"/>
    <line x1="905" y1="150" x2="985" y2="150"/>
  </g>
  <g fill="#0F1720" stroke="#2BC77E" stroke-width="2">
    <circle cx="1000" cy="70" r="10"/>
    <circle cx="1030" cy="150" r="10"/>
    <circle cx="1000" cy="230" r="10"/>
  </g>
  <circle cx="905" cy="150" r="16" fill="#2BC77E"/>
  <circle cx="905" cy="150" r="26" fill="none" stroke="#2BC77E" stroke-width="1.4" opacity="0.4"/>

  <!-- wordmark -->
  <text x="90" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#F3F6F5" letter-spacing="-1">
    <tspan fill="#5C6B70">@</tspan>kelvdra<tspan fill="#2BC77E">/</tspan>baileys
  </text>

  <text x="92" y="182" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="19" fill="#8FA3A8">
    WhatsApp multi-device socket client — modifikasi Kelvdra dari Baileys
  </text>

  <!-- meta row, no dot-separated chrome: simple spaced facts -->
  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="16" fill="#5C6B70">
    <text x="92" y="230">Node 20+</text>
    <text x="220" y="230">ESM</text>
    <text x="300" y="230">MIT license</text>
  </g>
</svg>
